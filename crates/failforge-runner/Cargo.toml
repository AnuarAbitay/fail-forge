[package]
name = "failforge-runner"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
libc.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true

[[bin]]
name = "failforge-process-fixture"
path = "tests/support/process_fixture.rs"
test = true
bench = false

[[example]]
name = "microbench"
test = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Console", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }

[target.'cfg(unix)'.dependencies]
sha2 = { workspace = true, features = ["asm"] }
