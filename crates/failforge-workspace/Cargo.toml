[package]
name = "failforge-workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
libc.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
failforge-runner = { path = "../failforge-runner" }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_Security_Cryptography"] }

[target.'cfg(unix)'.dependencies]
sha2 = { workspace = true, features = ["asm"] }
