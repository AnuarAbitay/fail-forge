[package]
name = "failforge-dart"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
failforge-runner = { path = "../failforge-runner" }
failforge-workspace = { path = "../failforge-workspace" }
tokio.workspace = true
serde.workspace = true
# Catalogue identity must preserve distinct finite float metadata values.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
thiserror.workspace = true
libc.workspace = true
regex = { version = "=1.13.1", default-features = false, features = ["std", "perf", "unicode"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes"] }

[[bin]]
name = "failforge-adapter-fixture"
path = "tests/support/adapter_fixture.rs"
test = false
bench = false

[[bin]]
name = "failforge-adapter-campaign"
path = "src/bin/campaign.rs"
test = false
bench = false
