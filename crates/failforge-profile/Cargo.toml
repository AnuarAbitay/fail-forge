[package]
name = "failforge-profile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
failforge-workspace = { path = "../failforge-workspace" }
failforge-config = { path = "../failforge-config" }
failforge-dart = { path = "../failforge-dart" }
failforge-runner = { path = "../failforge-runner" }
libc.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
libyaml-safer = "=0.3.0"
unicode-normalization = "=0.1.25"
caseless = "=0.2.2"
regex = { version = "=1.13.1", default-features = false, features = ["std", "perf", "unicode"] }

[target.'cfg(unix)'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_Security", "Win32_System_IO"] }
