[package]
name = "failforge-profile"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
failforge-config = { path = "../failforge-config" }
failforge-dart = { path = "../failforge-dart" }
failforge-runner = { path = "../failforge-runner" }
libc.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, features = ["asm"] }
thiserror.workspace = true
libyaml-safer = "=0.3.0"
unicode-normalization = "=0.1.25"
caseless = "=0.2.2"
regex = { version = "=1.13.1", default-features = false, features = ["std", "perf", "unicode"] }
