[package]
name = "failforge-cli"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
failforge-runner = { path = "../failforge-runner" }
failforge-config = { path = "../failforge-config" }
failforge-profile = { path = "../failforge-profile" }
failforge-dart = { path = "../failforge-dart" }
failforge-workspace = { path = "../failforge-workspace" }
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
libc.workspace = true

[[bin]]
name = "failforge"
path = "src/main.rs"

[[bin]]
name = "failforge-cli-process-fixture"
path = "../failforge-runner/tests/support/process_fixture.rs"
test = false
bench = false
