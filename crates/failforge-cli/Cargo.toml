[package]
name = "failforge-cli"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true

[dependencies]
failforge-runner = { path = "../failforge-runner" }
failforge-config = { path = "../failforge-config" }
failforge-profile = { path = "../failforge-profile" }
failforge-dart = { path = "../failforge-dart" }
failforge-workspace = { path = "../failforge-workspace" }
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_Security", "Win32_Globalization", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp"] }

[[bin]]
name = "failforge"
path = "src/main.rs"

[[bin]]
name = "failforge-cli-process-fixture"
path = "../failforge-runner/tests/support/process_fixture.rs"
test = false
bench = false

[[bin]]
name = "failforge-campaign-sdk-fixture"
path = "tests/support/campaign_sdk_fixture.rs"
test = false
bench = false
