[package]
name = "failforge-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
clap.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
libc.workspace = true
failforge-dart = { path = "../failforge-dart" }
failforge-config = { path = "../failforge-config" }
failforge-workspace = { path = "../failforge-workspace" }


[[bin]]
name = "failforge-tools"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
failforge-runner = { path = "../failforge-runner" }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security"] }
