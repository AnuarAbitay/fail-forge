[workspace]
members = [
    "crates/failforge-cli",
    "crates/failforge-runner",
    "crates/failforge-dart",
    "crates/failforge-config",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }
libc = "=0.2.190"
thiserror = "=2.0.21"
tracing = "=0.1.44"
clap = { version = "=4.6.7", features = ["derive"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
