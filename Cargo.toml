[workspace]
members = [
    "crates/failforge-cli",
    "crates/failforge-runner",
    "crates/failforge-dart",
    "crates/failforge-config",
    "crates/failforge-profile",
    "crates/failforge-workspace",
    "crates/failforge-tools",
]
resolver = "3"

# Use release settings for ordinary build/run commands. The test profile
# inherits these settings; Cargo still places both profiles in target/debug.
[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 16

[workspace.package]
version = "0.1.0-beta.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }
libc = "=0.2.190"
thiserror = "=2.0.21"
tracing = "=0.1.44"
clap = { version = "=4.6.7", features = ["derive"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
