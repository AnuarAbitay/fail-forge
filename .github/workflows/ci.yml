name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Source revisions are fetched anonymously. No repository token or personal
# account is used for checkout, and this workflow never publishes artifacts.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  stable:
    name: Stable / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out the exact public revision without authentication
        shell: bash
        run: |
          set -euo pipefail
          git init --quiet "$GITHUB_WORKSPACE"
          GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/usr/bin/false \
            git -c credential.helper= -c http.extraHeader= fetch --quiet --no-tags --depth=1 \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Toolchain
        run: rustc --version --verbose
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets --locked -- --test-threads=1

  msrv:
    name: Rust 1.85.1 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out the exact public revision without authentication
        shell: bash
        run: |
          set -euo pipefail
          git init --quiet "$GITHUB_WORKSPACE"
          GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/usr/bin/false \
            git -c credential.helper= -c http.extraHeader= fetch --quiet --no-tags --depth=1 \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: dtolnay/rust-toolchain@1.85.1
      - name: Toolchain
        run: rustc --version --verbose
      - name: Check locked dependencies on MSRV
        run: cargo check --workspace --all-targets --locked
      - name: Tests on MSRV
        run: cargo test --workspace --all-targets --locked -- --test-threads=1

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact public revision without authentication
        shell: bash
        run: |
          set -euo pipefail
          git init --quiet "$GITHUB_WORKSPACE"
          GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/usr/bin/false \
            git -c credential.helper= -c http.extraHeader= fetch --quiet --no-tags --depth=1 \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: dtolnay/rust-toolchain@stable
      - name: Doctests
        run: cargo test --workspace --doc --locked
      - name: API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  dart-adapter:
    name: Dart adapter / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out the exact public revision without authentication
        shell: bash
        run: |
          set -euo pipefail
          git init --quiet "$GITHUB_WORKSPACE"
          GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/usr/bin/false \
            git -c credential.helper= -c http.extraHeader= fetch --quiet --no-tags --depth=1 \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned official Flutter SDK and verify archive digest
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p failforge-tools --locked -- install-test-flutter --destination "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "PUB_CACHE=$RUNNER_TEMP/pub-cache" >> "$GITHUB_ENV"
          echo "FLUTTER_SUPPRESS_ANALYTICS=true" >> "$GITHUB_ENV"
      - name: Prepare tooling dependencies and explicit example
        shell: bash
        run: |
          dart --suppress-analytics pub get --enforce-lockfile --directory adapters/dart
          (cd examples/flutter_fixture && flutter --suppress-analytics pub get --enforce-lockfile)
      - name: Dart formatting, analysis and tests
        env:
          FAILFORGE_OPERATOR_SCALING_PROBE: ${{ runner.temp }}/operator-scaling.json
        shell: bash
        run: |
          dart --suppress-analytics format --output=none --set-exit-if-changed adapters/dart examples/flutter_fixture
          (cd adapters/dart && dart --suppress-analytics analyze && dart --suppress-analytics test --concurrency 1)
      - name: Build Rust tools and check adapter integration
        shell: bash
        run: |
          cargo build --workspace --examples --locked
          cargo build --workspace --locked
          cargo build --release --workspace --bins --examples --locked
          cargo test -p failforge-dart --all-targets --locked -- --test-threads=1
          mkdir -p .toolchain
          ln -s "$RUNNER_TEMP/flutter" .toolchain/flutter
          ln -s "$PUB_CACHE" .toolchain/pub-cache
      - name: All 19 Dart semantic operators through Rust and the Dart VM
        shell: bash
        run: |
          target/debug/failforge-tools semantic-e2e --output "$RUNNER_TEMP/dart-semantic-e2e" --dart-sdk "$RUNNER_TEMP/flutter/bin/cache/dart-sdk"
      - name: Timeout scenarios before the full SDK regression
        shell: bash
        run: |
          target/release/failforge-tools regression --suite timeouts --binary-dir target/release --output "$RUNNER_TEMP/timeout-regression" --dart-sdk "$RUNNER_TEMP/flutter/bin/cache/dart-sdk"
          for scenario in inner-timeout outer-timeout; do
            jq '{status, baseline: {outcome: .baseline.outcome, wallSeconds: .baseline.wallSeconds}, outcomeCounts, records: [.records[] | {outcome, reason, wallSeconds, runner: {cause: .runner.cause, cleanup: .runner.cleanup}}]}' \
              "$RUNNER_TEMP/timeout-regression/$scenario/summary.json"
          done
      - name: Native CLI, profiles, initialization, timeouts and recovery regressions
        shell: bash
        run: |
          target/release/failforge-tools regression --binary-dir target/release --output "$RUNNER_TEMP/native-regression" --dart-sdk "$RUNNER_TEMP/flutter/bin/cache/dart-sdk" --flutter-sdk "$RUNNER_TEMP/flutter"
      - name: Package native beta with the matching Rust runtime notices
        shell: bash
        run: |
          set -euo pipefail
          rustup component add rust-docs rust-src
          target/debug/failforge-tools package \
            --installation "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/beta-package"
      - name: Verify and install the actual archive with a fresh dependency cache
        shell: bash
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/beta-package" && shasum -a 256 -c SHA256SUMS)
          archive=$(jq -er '.archive' "$RUNNER_TEMP/beta-package/package-manifest.json")
          archive_root=$(jq -er '.archiveRoot' "$RUNNER_TEMP/beta-package/package-manifest.json")
          mkdir "$RUNNER_TEMP/extracted beta"
          tar -xzf "$RUNNER_TEMP/beta-package/$archive" -C "$RUNNER_TEMP/extracted beta"
          mv "$RUNNER_TEMP/extracted beta/$archive_root" "$RUNNER_TEMP/moved beta installation"
          target/debug/failforge-tools package-smoke \
            --installation "$RUNNER_TEMP/moved beta installation" \
            --dart-sdk "$RUNNER_TEMP/flutter/bin/cache/dart-sdk" \
            --output "$RUNNER_TEMP/beta-package-smoke"
