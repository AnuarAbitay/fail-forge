name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Source archives are downloaded anonymously. No repository token or personal
# account is used for checkout, and this workflow never publishes artifacts.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  stable:
    name: Stable / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Download public source without authentication
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 60 \
            --output "$RUNNER_TEMP/failforge-source.tar.gz" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/archive/$GITHUB_SHA.tar.gz"
          tar -xzf "$RUNNER_TEMP/failforge-source.tar.gz" \
            --strip-components=1 -C "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Toolchain
        run: rustc --version --verbose
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets --locked -- --test-threads=1
      - name: Benchmark statistics and protocol tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Mutation campaign configuration and lifecycle tests
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/campaign-python"
          "$RUNNER_TEMP/campaign-python/bin/python" -m pip install -r python/requirements.txt
          PYTHONPATH=python:scripts "$RUNNER_TEMP/campaign-python/bin/python" -B -m unittest discover -s python/tests -v
          PATH="$RUNNER_TEMP/campaign-python/bin:$PATH" cargo test -p failforge-cli --test profile_generate --locked -- --test-threads=1

  msrv:
    name: Rust 1.85.1 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Download public source without authentication
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 60 \
            --output "$RUNNER_TEMP/failforge-source.tar.gz" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/archive/$GITHUB_SHA.tar.gz"
          tar -xzf "$RUNNER_TEMP/failforge-source.tar.gz" \
            --strip-components=1 -C "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@1.85.1
      - name: Toolchain
        run: rustc --version --verbose
      - name: Check locked dependencies on MSRV
        run: cargo check --workspace --all-targets --locked
      - name: Tests on MSRV
        run: cargo test --workspace --all-targets --locked -- --test-threads=1

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download public source without authentication
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 60 \
            --output "$RUNNER_TEMP/failforge-source.tar.gz" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/archive/$GITHUB_SHA.tar.gz"
          tar -xzf "$RUNNER_TEMP/failforge-source.tar.gz" \
            --strip-components=1 -C "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
      - name: Doctests
        run: cargo test --workspace --doc --locked
      - name: API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  dart-adapter:
    name: Dart adapter / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Download public source without authentication
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 60 \
            --output "$RUNNER_TEMP/failforge-source.tar.gz" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/archive/$GITHUB_SHA.tar.gz"
          tar -xzf "$RUNNER_TEMP/failforge-source.tar.gz" \
            --strip-components=1 -C "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned official Flutter SDK and verify archive digest
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/install_test_flutter.py --destination "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "PUB_CACHE=$RUNNER_TEMP/pub-cache" >> "$GITHUB_ENV"
          echo "FLUTTER_SUPPRESS_ANALYTICS=true" >> "$GITHUB_ENV"
      - name: Prepare tooling dependencies and explicit example
        shell: bash
        run: |
          dart --suppress-analytics pub get --enforce-lockfile --directory adapters/dart
          (cd examples/flutter_fixture && flutter --suppress-analytics pub get --enforce-lockfile)
      - name: Dart formatting, analysis and tests
        env:
          FAILFORGE_OPERATOR_SCALING_PROBE: ${{ runner.temp }}/operator-scaling.json
        shell: bash
        run: |
          dart --suppress-analytics format --output=none --set-exit-if-changed adapters/dart examples/flutter_fixture
          (cd adapters/dart && dart --suppress-analytics analyze && dart --suppress-analytics test --concurrency 1)
      - name: Rust integration and actual Flutter mutation fixture
        shell: bash
        run: |
          cargo build --workspace --examples --locked
          cargo build --workspace --locked
          cargo test -p failforge-dart --all-targets --locked -- --test-threads=1
          python3 -m unittest discover -s scripts -p 'test_dart_adapter_e2e.py'
          python3 scripts/dart_adapter_e2e.py --flutter-sdk "$RUNNER_TEMP/flutter" --output "$RUNNER_TEMP/adapter-e2e" --p1
      - name: Native Dart initialization and timeout regressions
        shell: bash
        run: |
          mkdir -p .toolchain
          ln -s "$RUNNER_TEMP/flutter" .toolchain/flutter
          ln -s "$PUB_CACHE" .toolchain/pub-cache
          python3 scripts/dart_initialization_e2e.py --output "$RUNNER_TEMP/initialization-e2e"
          python3 scripts/dart_timeout_e2e.py --output "$RUNNER_TEMP/timeout-e2e"
          python3 scripts/dart_timeout_campaign_e2e.py --output "$RUNNER_TEMP/timeout-campaign-e2e"
      - name: All 19 Dart semantic operators through Rust and the Dart VM
        shell: bash
        run: |
          python3 scripts/dart_semantic_e2e.py --output "$RUNNER_TEMP/dart-semantic-e2e"
      - name: Real mutation CLI, YAML parity, cancellation and Flutter failures
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/mutate-python"
          "$RUNNER_TEMP/mutate-python/bin/python" -m pip install -r python/requirements.txt
          "$RUNNER_TEMP/mutate-python/bin/python" scripts/mutate_cli_e2e.py --output "$RUNNER_TEMP/mutate-cli-e2e" --flutter-sdk "$RUNNER_TEMP/flutter"
          "$RUNNER_TEMP/mutate-python/bin/python" -B scripts/mutation_profile_e2e.py --output "$RUNNER_TEMP/mutation-profile-e2e" --flutter-sdk "$RUNNER_TEMP/flutter"
          "$RUNNER_TEMP/mutate-python/bin/python" -B scripts/profile_applicability_e2e.py --output "$RUNNER_TEMP/profile-applicability-e2e" --dart-sdk "$RUNNER_TEMP/flutter/bin/cache/dart-sdk"
          "$RUNNER_TEMP/mutate-python/bin/python" scripts/workspace_recovery_e2e.py --output "$RUNNER_TEMP/workspace-recovery-e2e"
