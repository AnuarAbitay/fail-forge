name: Windows native

on:
  push:
  pull_request:
  workflow_dispatch:

# Fetch only the exact public source revision; no repository token is granted.
permissions: {}

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FLUTTER_SUPPRESS_ANALYTICS: 'true'

defaults:
  run:
    shell: pwsh

jobs:
  rust:
    name: Native Rust / windows-latest
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out the exact public revision without authentication
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:GIT_CONFIG_NOSYSTEM = '1'
          $env:GIT_CONFIG_GLOBAL = Join-Path $env:RUNNER_TEMP 'anonymous-gitconfig'
          [IO.File]::WriteAllText($env:GIT_CONFIG_GLOBAL, '')
          $env:GIT_TERMINAL_PROMPT = '0'
          git init --quiet $env:GITHUB_WORKSPACE
          git -c credential.helper= -c http.extraHeader= fetch --quiet --no-tags --depth=1 "${env:GITHUB_SERVER_URL}/${env:GITHUB_REPOSITORY}.git" $env:GITHUB_SHA
          git -c core.autocrlf=false checkout --quiet --detach FETCH_HEAD
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Checkout SHA differs from requested revision' }
      - name: Check release script syntax and upload guards without credentials
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE '.github/scripts/windows_release_package.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }
          python --version
          python -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check native Windows toolchain, formatting and all targets
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          rustc --version --verbose
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run native process, IPC, filesystem and CLI tests
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test --workspace --all-targets --locked --no-fail-fast -- --test-threads=1
          cargo run -p failforge-cli --bin failforge --locked -- --version

      - name: Check all native targets on Rust 1.85.1
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 check --workspace --all-targets --locked

  compiler-launch-probe:
    name: Native Dart compiler launch paths
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact public revision without authentication
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:GIT_CONFIG_NOSYSTEM = '1'
          $env:GIT_CONFIG_GLOBAL = Join-Path $env:RUNNER_TEMP 'anonymous-gitconfig'
          [IO.File]::WriteAllText($env:GIT_CONFIG_GLOBAL, '')
          $env:GIT_TERMINAL_PROMPT = '0'
          git init --quiet $env:GITHUB_WORKSPACE
          git -c credential.helper= -c http.extraHeader= fetch --quiet --no-tags --depth=1 "${env:GITHUB_SERVER_URL}/${env:GITHUB_REPOSITORY}.git" $env:GITHUB_SHA
          git -c core.autocrlf=false checkout --quiet --detach FETCH_HEAD
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Checkout SHA differs from requested revision' }
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.5'
      - name: Compare relative and absolute runtime startup from the same deep directory
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $dart = (Get-Command dart.exe).Source
          $sdk = Split-Path (Split-Path $dart -Parent) -Parent
          & $dart --version
          & $dart --suppress-analytics pub get --enforce-lockfile --directory adapters/dart
          $packages = ([Uri](Join-Path $env:GITHUB_WORKSPACE 'adapters/dart/.dart_tool/package_config.json')).AbsoluteUri
          $probe = ([Uri](Join-Path $env:GITHUB_WORKSPACE 'adapters/dart/test/fixtures/windows_compiler_launch.dart')).AbsoluteUri
          # A sibling of the SDK guarantees same-drive relative paths.
          & $dart "--packages=$packages" $probe $sdk (Split-Path $sdk -Parent)

  sdk:
    name: Flutter ${{ matrix.flutter }} / windows-latest
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.47.7', stable]
    env:
      FLUTTER_VERSION: ${{ matrix.flutter }}
    steps:
      - name: Check out the exact public revision without authentication
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:GIT_CONFIG_NOSYSTEM = '1'
          $env:GIT_CONFIG_GLOBAL = Join-Path $env:RUNNER_TEMP 'anonymous-gitconfig'
          [IO.File]::WriteAllText($env:GIT_CONFIG_GLOBAL, '')
          $env:GIT_TERMINAL_PROMPT = '0'
          git init --quiet $env:GITHUB_WORKSPACE
          git -c credential.helper= -c http.extraHeader= fetch --quiet --no-tags --depth=1 "${env:GITHUB_SERVER_URL}/${env:GITHUB_REPOSITORY}.git" $env:GITHUB_SHA
          git -c core.autocrlf=false checkout --quiet --detach FETCH_HEAD
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Checkout SHA differs from requested revision' }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install official Flutter SDK and verify archive digest
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo run -p failforge-tools --locked -- install-test-flutter --version $env:FLUTTER_VERSION --destination $env:RUNNER_TEMP
          $flutterRoot = Join-Path $env:RUNNER_TEMP 'flutter'
          $pubCache = Join-Path $env:RUNNER_TEMP 'pub-cache'
          New-Item -ItemType Directory -Force $pubCache | Out-Null
          "FLUTTER_ROOT=$flutterRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PUB_CACHE=$pubCache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Join-Path $flutterRoot 'bin') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Prepare adapter and Flutter example with the native Dart executable
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $dart = Join-Path $env:FLUTTER_ROOT 'bin/cache/dart-sdk/bin/dart.exe'
          $flutterTools = Join-Path $env:FLUTTER_ROOT 'bin/cache/flutter_tools.snapshot'
          & $dart --version
          & $dart --suppress-analytics pub get --enforce-lockfile --directory adapters/dart
          Push-Location examples/flutter_fixture
          try {
            if ($env:FLUTTER_VERSION -eq 'stable') { & $dart $flutterTools --suppress-analytics pub get }
            else { & $dart $flutterTools --suppress-analytics pub get --enforce-lockfile }
          } finally { Pop-Location }
      - name: Verify native Dart adapter startup with file URI arguments
        run: |
          $ErrorActionPreference = 'Stop'
          $dart = Join-Path $env:FLUTTER_ROOT 'bin/cache/dart-sdk/bin/dart.exe'
          $adapter = Join-Path $env:GITHUB_WORKSPACE 'adapters/dart'
          $packages = ([Uri](Join-Path $adapter '.dart_tool/package_config.json')).AbsoluteUri
          $script = ([Uri](Join-Path $adapter 'bin/failforge_dart_adapter.dart')).AbsoluteUri
          $cases = @(
            @{ Name='ordinary'; Program=$dart; Directory=$adapter; Packages=$packages; Script=$script },
            @{ Name='verbatim-directory'; Program=$dart; Directory="\\?\$adapter"; Packages=$packages; Script=$script }
          )
          $failed = @()
          foreach ($case in $cases) {
            $info = [Diagnostics.ProcessStartInfo]::new()
            $info.FileName = $case.Program
            $info.WorkingDirectory = $case.Directory
            $info.UseShellExecute = $false
            $info.RedirectStandardInput = $true
            $info.RedirectStandardOutput = $true
            $info.RedirectStandardError = $true
            $info.ArgumentList.Add("--packages=$($case.Packages)")
            $info.ArgumentList.Add($case.Script)
            $process = [Diagnostics.Process]::new()
            $process.StartInfo = $info
            try {
              [void]$process.Start()
              $output = $process.StandardOutput.ReadToEndAsync()
              $errors = $process.StandardError.ReadToEndAsync()
              $process.StandardInput.Close()
              if (-not $process.WaitForExit(30000)) {
                $process.Kill($true)
                [void]$process.WaitForExit(5000)
                $failed += $case.Name
                Write-Output "Startup $($case.Name): timeout"
              } else {
                Write-Output "Startup $($case.Name): exit $($process.ExitCode)"
                if ($process.ExitCode -ne 0) { $failed += $case.Name }
              }
              if ([Threading.Tasks.Task]::WaitAll([Threading.Tasks.Task[]]@($output, $errors), 5000)) {
                foreach ($task in @($output, $errors)) {
                  $value = $task.GetAwaiter().GetResult()
                  Write-Output ($value.Substring([Math]::Max(0, $value.Length - 8192)))
                }
              } else { Write-Output 'Startup capture did not finish' }
            } finally { $process.Dispose() }
          }
          if ($failed.Count) { throw "Adapter startup failed for: $($failed -join ', ')" }
      - name: Check Dart formatting on the pinned SDK
        if: matrix.flutter != 'stable'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & (Join-Path $env:FLUTTER_ROOT 'bin/cache/dart-sdk/bin/dart.exe') --suppress-analytics format --output=none --set-exit-if-changed adapters/dart examples/flutter_fixture
      - name: Build native tools and verify the public doctor command
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --workspace --bins --examples --locked
          cargo build --release --workspace --bins --examples --locked
          $dartSdk = Join-Path $env:FLUTTER_ROOT 'bin/cache/dart-sdk'
          & target/debug/failforge.exe doctor --installation $env:GITHUB_WORKSPACE --project examples/flutter_fixture --flutter-sdk $env:FLUTTER_ROOT
      - name: Run all 19 Dart semantic operators through the native CLI and VM
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & target/debug/failforge-tools.exe semantic-e2e --output (Join-Path $env:RUNNER_TEMP 'dart-semantic-windows') --dart-sdk (Join-Path $env:FLUTTER_ROOT 'bin/cache/dart-sdk')
      - name: Analyze and test the Dart adapter on Windows
        working-directory: adapters/dart
        env:
          FAILFORGE_OPERATOR_SCALING_PROBE: ${{ runner.temp }}/operator-scaling-windows.json
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $dart = Join-Path $env:FLUTTER_ROOT 'bin/cache/dart-sdk/bin/dart.exe'
          & $dart --suppress-analytics analyze
          & $dart --suppress-analytics test --concurrency 1
      - name: Build and verify the Windows release package with a fresh cache
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          rustup component add rust-docs rust-src
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq 'failforge-cli' }).version
          & .github/scripts/windows_release_package.ps1 -Installation $env:GITHUB_WORKSPACE -DartSdk (Join-Path $env:FLUTTER_ROOT 'bin/cache/dart-sdk') -PackageDirectory (Join-Path $env:RUNNER_TEMP 'windows-package') -SmokeOutput (Join-Path $env:RUNNER_TEMP 'windows-package-smoke') -ExpectedVersion $version
      - name: Run native CLI, replay, profiles, timeouts and recovery regressions
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & target/release/failforge-tools.exe regression --binary-dir target/release --output (Join-Path $env:RUNNER_TEMP 'native-regression-windows') --dart-sdk (Join-Path $env:FLUTTER_ROOT 'bin/cache/dart-sdk') --flutter-sdk $env:FLUTTER_ROOT
          $summary = Get-Content (Join-Path $env:RUNNER_TEMP 'native-regression-windows/summary.json') -Raw | ConvertFrom-Json
          $required = @('windows-console-ctrl-c', 'windows-console-ctrl-break', 'windows-console-ctrl-c-ignored', 'windows-controller-crash')
          foreach ($name in $required) {
            $cases = @($summary.cases | Where-Object { $_.name -eq $name })
            if ($cases.Count -ne 1) { throw "Missing or duplicate native regression evidence: $name" }
            $cases[0] | ConvertTo-Json -Depth 8
          }
      - name: Show bounded regression diagnostics on failure
        if: failure()
        run: |
          $ErrorActionPreference = 'Continue'
          foreach ($name in @('dart-semantic-windows', 'native-regression-windows', 'windows-package-smoke')) {
            $root = Join-Path $env:RUNNER_TEMP $name
            if (-not (Test-Path $root)) { continue }
            $files = Get-ChildItem $root -File -Recurse |
              Where-Object { $_.Name -in @('command.json', 'summary.json', 'stderr.log', 'stdout.log', 'stderr.bin', 'stdout.bin', 'host-ready.json', 'host-result.json', 'host-stdout.log', 'host-stderr.log', 'windows-controller-crash-evidence.json') } |
              Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 16
            foreach ($file in $files) {
              Write-Output "Diagnostic: $($file.FullName)"
              $stream = [IO.File]::OpenRead($file.FullName)
              try {
                $length = [int][Math]::Min(8192, $stream.Length)
                [void]$stream.Seek(-$length, [IO.SeekOrigin]::End)
                $bytes = [byte[]]::new($length)
                $count = $stream.Read($bytes, 0, $length)
                Write-Output ([Text.Encoding]::UTF8.GetString($bytes, 0, $count))
              } finally { $stream.Dispose() }
            }
          }
